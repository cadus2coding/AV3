<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unova Map · Pokédex & Spawns</title>
<style>
:root{
  --bg:#0b0f19; --p:#131a2a; --p2:#1b2438; --tx:#f0f4fc;
  --mu:#8a99b8; --ac:#38bdf8; --ac2:#f43f5e; --ln:#283552; --hit:#facc15;
  --sea:#081220;
  color-scheme:dark; box-sizing:border-box;
}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--tx);
  font:13px/1.45 'Segoe UI', system-ui, -apple-system, sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}

/* Header Limpo */
header{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  padding:10px 18px; background:var(--p); border-bottom:1px solid var(--ln);
  box-shadow:0 4px 15px rgba(0,0,0,0.4); z-index:20;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; letter-spacing:0.08em; color:#fff;}
.brand span{background:var(--ac); color:#071324; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:900;}
input,button{
  background:var(--p2); color:var(--tx); border:1px solid var(--ln);
  border-radius:6px; padding:7px 12px; font:inherit; outline:none; transition:0.15s;
}
input:hover,input:focus,button:hover{border-color:var(--ac);}
button{cursor:pointer; font-weight:600;}
#q{flex:1; min-width:200px; max-width:420px;}

main{flex:1; display:flex; min-height:0; position:relative;}

/* Área do Mapa */
#map{
  flex:1; position:relative; background:var(--sea); min-width:0;
  background-image:radial-gradient(circle at center, #0f213a 0%, #060d18 100%);
}
svg{width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
svg:active{cursor:grabbing;}

/* Bolinhas Interativas sobre o Mapa */
.node-group{cursor:pointer; transition:opacity 0.2s;}
.node-group.dim{opacity:0.25;}
.node-hit-area{fill:transparent; stroke:none;}
.node-shape{
  fill:rgba(15, 23, 42, 0.85); stroke:var(--ac); stroke-width:2.5;
  transition:all 0.15s ease; transform-box:fill-box; transform-origin:center;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.75));
}
.node-group:hover .node-shape, .node-group.sel .node-shape{
  fill:var(--ac); stroke:#fff; stroke-width:3; transform:scale(1.28);
  filter:drop-shadow(0 0 10px var(--ac));
}
.node-group.hit .node-shape{
  fill:var(--hit); stroke:#fff; stroke-width:3; transform:scale(1.32);
  filter:drop-shadow(0 0 12px var(--hit));
}
.node-label{
  fill:#fff; font-size:11px; font-weight:800; pointer-events:none;
  paint-order:stroke; stroke:#060d18; stroke-width:3.5px; letter-spacing:0.02em;
}

/* Controles Flutuantes */
.zc{position:absolute; right:14px; top:14px; display:flex; flex-direction:column; gap:6px; z-index:10;}
.zc button{width:34px; height:34px; padding:0; display:grid; place-items:center; font-size:16px; background:var(--p); box-shadow:0 2px 8px rgba(0,0,0,0.5);}

.legend{
  position:absolute; left:14px; bottom:14px; background:rgba(19,26,42,0.9);
  border:1px solid var(--ln); border-radius:8px; padding:7px 12px; font-size:11px;
  display:flex; gap:12px; align-items:center; backdrop-filter:blur(4px); z-index:10;
}
.leg-item{display:flex; align-items:center; gap:5px; color:var(--mu);}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
.upload-btn{
  pointer-events:auto; background:var(--p2); border:1px solid var(--ln);
  color:var(--tx); padding:3px 8px; border-radius:4px; cursor:pointer; font-size:11px;
}
.upload-btn:hover{border-color:var(--ac); color:var(--ac);}

/* Painel Lateral Pokédex */
#panel{
  width:420px; background:var(--p); border-left:1px solid var(--ln);
  overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px;
}
.grab{display:none;}
.loc-header{border-bottom:1px solid var(--ln); padding-bottom:10px; margin-bottom:4px;}
.loc-header h2{margin:0; font-size:19px; color:#fff; display:flex; align-items:center; justify-content:space-between;}
.loc-sub{display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:12px; color:var(--mu);}

.g{
  margin:10px 0 4px; font-size:11px; font-weight:800; letter-spacing:0.08em;
  color:var(--ac); text-transform:uppercase; display:flex; align-items:center; gap:6px;
}
.g::after{content:""; flex:1; height:1px; background:var(--ln);}

/* Cards dos Pokémon */
details.c{
  background:var(--p2); border:1px solid var(--ln); border-radius:8px;
  transition:border-color 0.15s; overflow:hidden;
}
details.c:hover{border-color:#475569;}
details.c[open]{border-color:var(--ac);}
details>summary{cursor:pointer; list-style:none;}
details>summary::-webkit-details-marker{display:none;}
details.c>summary{display:flex; align-items:center; gap:10px; padding:8px 10px; flex-wrap:wrap;}

.sp-box{
  width:52px; height:52px; border-radius:8px; display:grid; place-items:center;
  flex:none; border:1px solid rgba(255,255,255,0.12); position:relative; overflow:hidden;
}
.sp-box img{
  width:56px; height:56px; object-fit:contain; image-rendering:pixelated;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,0.65));
}

.ty{
  display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px;
  font-weight:800; color:#111; text-transform:uppercase;
}
.rate-box{text-align:right; font-size:12px;}
.rate-val{font-weight:800; color:#fff; font-size:13px;}

.tags{display:flex; gap:6px; width:100%; margin-top:2px; flex-wrap:wrap;}
.badge{
  display:inline-flex; align-items:center; gap:4px; padding:2px 7px;
  border-radius:4px; font-size:10px; font-weight:700; background:rgba(0,0,0,0.35);
  border:1px solid var(--ln); color:var(--mu);
}
.badge.ver{border-color:#6366f1; color:#a5b4fc;}
.badge.sea{border-color:#eab308; color:#fde047;}

.bd{padding:0 12px 12px; border-top:1px solid rgba(255,255,255,0.05); margin-top:2px;}
.ab{
  display:inline-block; border:1px solid var(--ln); border-radius:4px;
  background:rgba(0,0,0,0.25); padding:3px 8px; margin:2px 4px 2px 0; cursor:help; font-size:12px;
}
.ab em{
  background:var(--hit); color:#111; border-radius:3px; padding:0 4px;
  margin-left:5px; font-style:normal; font-size:9px; font-weight:900;
}
.mv{
  display:inline-block; background:var(--bg); border:1px solid var(--ln);
  border-radius:4px; padding:2px 7px; margin:2px 3px 2px 0; font-size:11px;
}
.ev{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; margin-top:4px;}
.st{
  background:var(--bg); border:1px solid var(--ln); border-radius:6px;
  padding:4px 8px; display:inline-flex; flex-direction:column; align-items:center; gap:2px;
}
.st img{width:38px; height:38px; object-fit:contain; image-rendering:pixelated;}
.st.me{background:rgba(56,189,248,0.18); color:#fff; font-weight:800; border-color:var(--ac);}
.ar{color:var(--mu); font-size:10px; text-align:center; line-height:1.1;}

@media(max-width:850px){
  main{flex-direction:column;}
  #panel{
    position:fixed; left:0; right:0; bottom:0; width:auto; max-height:58vh;
    border:0; border-top:2px solid var(--ac); border-radius:16px 16px 0 0;
    transform:translateY(105%); transition:transform 0.25s ease;
    box-shadow:0 -10px 30px rgba(0,0,0,0.8); z-index:30;
  }
  #panel.on{transform:none;} #panel.big{max-height:88vh;}
  .grab{display:block; width:44px; height:4px; border-radius:2px; background:var(--mu); margin:0 auto 6px;}
  .legend{display:none;}
}
</style>

const HINT=`
<div style="text-align:center; padding:32px 14px; color:var(--mu);">
  <div style="font-size:34px; margin-bottom:8px;">🗺️</div>
  <b style="color:#fff; font-size:15px;">Região de Unova</b>
  <p style="margin:8px 0 14px;">Passe o mouse sobre qualquer bolinha no mapa para ver todos os Pokémon que aparecem naquela rota ou caverna, incluindo versões e estações.</p>
  <div style="background:var(--p2); border:1px solid var(--ln); border-radius:6px; padding:10px; text-align:left; font-size:12px;">
    <b>Dicas rápidas:</b><br>
    • <b>Clique</b> em uma bolinha para fixar o painel lateral.<br>
    • Use o <b>scroll do mouse</b> para zoom e arraste para mover o mapa.<br>
    • Digite o nome de um Pokémon na barra acima para iluminar onde ele aparece.
  </div>
</div>`;

/* ===== RENDERIZAÇÃO DO MAPA ===== */
let hov=null, pin=null, vb=[0,0,W,H], moved=false, d=null, last='';
const svg=$('#svg');

function buildMapSVG(){
  const nodesSVG = LOC.map(l => `
    <g class="node-group" data-id="${l.id}">
      <circle class="node-hit-area" cx="${l.x}" cy="${l.y}" r="${l.r + 10}"/>
      <circle class="node-shape" cx="${l.x}" cy="${l.y}" r="${l.r}"/>
      <text class="node-label" x="${l.x}" y="${l.y - l.r - 6}" text-anchor="middle">${l.n}</text>
    </g>
  `).join('');

  svg.innerHTML = `
    <image id="bg" href="${LOCAL_MAP}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid meet" />
    ${nodesSVG}
  `;

  /* Se a imagem local não estiver na pasta ainda, tenta o fallback online automaticamente */
  const imgEl = $('#bg');
  imgEl.addEventListener('error', () => {
    if (imgEl.getAttribute('href') !== ONLINE_FALLBACK) {
      imgEl.setAttribute('href', ONLINE_FALLBACK);
    }
  });
}

buildMapSVG();

const q = () => $('#q').value.trim().toLowerCase();
const hit = e => {
  const k = q(), p = PK[e[0]];
  return !!k && (p.n.toLowerCase().includes(k) || p.t.some(t => t.includes(k)) || p.a.some(a => a && a.toLowerCase().includes(k)));
};

function draw(){
  const k = q(), cur = pin || hov;
  document.querySelectorAll('.node-group').forEach(g => {
    const l_data = LOC.find(x => x.id == g.dataset.id);
    const s = l_data.sp;
    let cls = 'node-group';
    if (g.dataset.id == cur) cls += ' sel';
    if (k) cls += s.some(hit) ? ' hit' : ' dim';
    g.setAttribute('class', cls);
  });
}

function card(e){
  const [k,m,r,a,b,seasons,versions] = e;
  const p = PK[k], ls = LS[k];
  const mv = L => ls.filter(x => x[0] <= L).slice(-4).map(x => `<span class="mv">${x[1]}</span>`).join('');
  const c1 = T[p.t[0]], c2 = T[p.t[1] || p.t[0]];
  
  const seaStr = seasons ? seasons.map(i => `${SEA_ICONS[i]} ${SEA[i]}`).join(', ') : '🌸 ☀️ 🍂 ❄️ Todas';
  const verStr = versions ? versions.join(' / ') : 'Black · White · B2 · W2';

  return `<details class="c"${hit(e) ? ' open' : ''}>
    <summary>
      <span class="sp-box" style="background:linear-gradient(135deg,${c1}55,${c2}55)">
        <img src="${getSprite(p.d)}" alt="${p.n}" loading="lazy" onerror="this.onerror=null;this.src='${SPRITE_FALLBACK}${p.d}.png'">
      </span>
      <div style="flex:1;">
        <b style="font-size:14px; color:#fff;">${p.n} <span class="mu" style="font-weight:normal;">#${p.d}</span></b>
        <div style="margin-top:2px;">${p.t.map(t => `<span class="ty" style="background:${T[t]}">${t}</span>`).join(' ')}</div>
      </div>
      <div class="rate-box">
        <div class="rate-val">${M[m][0]} ${r}%</div>
        <div class="mu">Nv. ${a}${b>a ? '–'+b : ''}</div>
      </div>
      <div class="tags">
        <span class="badge ver" title="Versões em que aparece">🎮 ${verStr}</span>
        <span class="badge sea" title="Estações em que aparece">📅 ${seaStr}</span>
      </div>
    </summary>
    <div class="bd">
      <div class="g">Habilidades Possíveis</div>
      ${p.a.map((x,i) => x ? `<span class="ab" title="${AB[x]||''}">${x}${i==2 ? '<em>HA</em>' : ''}</span>` : '').join('')}
      
      <div class="g">Moveset Selvagem (Por Nível)</div>
      <div style="margin-bottom:4px;"><span class="mu">Nv. ${a}:</span> ${mv(a)}</div>
      ${b>a ? `<div><span class="mu">Nv. ${b}:</span> ${mv(b)}</div>` : ''}
      <details style="margin-top:6px;"><summary class="mu" style="text-decoration:underline;">Ver learnset completo</summary><div style="margin-top:4px;">${ls.map(x => `<span class="mv"><b>Nv.${x[0]}</b> ${x[1]}</span>`).join('')}</div></details>
      
      <div class="g">Linha Evolutiva</div>
      <div class="ev">
        ${EV[k].map((s,i) => {
          const [dex, n, r2] = s.split('|');
          return (i ? `<span class="ar">${r2}<br>➔</span>` : '') +
            `<span class="st${n==p.n ? ' me' : ''}">
              <img src="${getSprite(dex)}" alt="${n}" loading="lazy" onerror="this.onerror=null;this.src='${SPRITE_FALLBACK}${dex}.png'">
              <span>${n}</span>
            </span>`;
        }).join('')}
      </div>
    </div>
  </details>`;
}

function show(){
  const P=$('#panel'), id = pin || hov, l = LOC.find(x => x.id == id), key = [id, pin?1:0, q()].join();
  P.classList.toggle('on', !!l);
  if(key == last) return;
  last = key;

  if(!l){ P.innerHTML = HINT; return; }

  const s = l.sp;
  let h = `<div class="grab"></div>
  <div class="loc-header">
    <h2>${l.n} ${pin ? '<button class="x" style="font-size:11px; padding:3px 8px; background:var(--ac2); border:none; color:#fff;">✕ Soltar</button>' : ''}</h2>
    <div class="loc-sub">
      <span>Todos os encontros da localidade</span>
      <span>${pin ? '📌 Rota fixada' : 'Clique na bolinha para fixar'}</span>
    </div>
  </div>`;

  if(!s.length){
    h += '<p class="mu" style="padding:12px 0;">Nenhum Pokémon cadastrado nesta localidade.</p>';
  }

  const gs = {};
  s.forEach(e => (gs[e[1]] = gs[e[1]] || []).push(e));

  for(const m in gs){
    h += `<div class="g">${M[m][0]} ${M[m][1]}</div>`;
    gs[m].sort((a,b) => b[2] - a[2]).forEach(e => h += card(e));
  }
  P.innerHTML = h;
}

const go = () => { draw(); show(); };

$('#panel').onclick = e => {
  if(e.target.closest('.x')){ pin = null; go(); }
  else if(e.target.closest('.grab')) $('#panel').classList.toggle('big');
};
$('#q').oninput = go;
addEventListener('keydown', e => { if(e.key == 'Escape'){ pin = null; go(); } });

/* Pan & Zoom */
const pt = (x,y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(svg.getScreenCTM().inverse()); };
const setVB = () => svg.setAttribute('viewBox', vb.join(' '));

function zoom(f,x,y){
  const r = svg.getBoundingClientRect(), p = pt(x ?? r.left + r.width/2, y ?? r.top + r.height/2);
  const w = Math.min(W*1.3, Math.max(W/8, vb[2]*f)), g = w/vb[2];
  vb = [p.x - (p.x - vb[0])*g, p.y - (p.y - vb[1])*g, w, vb[3]*g];
  setVB();
}

svg.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 0.85 : 1.18, e.clientX, e.clientY); }, {passive:false});
svg.addEventListener('pointerdown', e => { d = {x:e.clientX, y:e.clientY, v:[...vb]}; moved = false; });
addEventListener('pointermove', e => {
  if(!d) return;
  const r = svg.getBoundingClientRect(), s = Math.max(d.v[2]/r.width, d.v[3]/r.height);
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if(Math.abs(dx) + Math.abs(dy) > 5) moved = true;
  if(moved){ vb = [d.v[0] - dx*s, d.v[1] - dy*s, d.v[2], d.v[3]]; setVB(); }
});
addEventListener('pointerup', () => { d = null; });
$('#zi').onclick = () => zoom(0.8);
$('#zo').onclick = () => zoom(1.25);
$('#zr').onclick = () => { vb = [0,0,W,H]; setVB(); };

/* Interação com Bolinhas do Mapa */
svg.addEventListener('pointerover', e => {
  if(d && moved) return;
  const g = e.target.closest('.node-group');
  hov = g ? g.dataset.id : null;
  go();
});
svg.addEventListener('pointerleave', () => { hov = null; go(); });
svg.addEventListener('click', e => {
  if(moved) return;
  const g = e.target.closest('.node-group');
  pin = g && g.dataset.id != pin ? g.dataset.id : null;
  go();
});

/* Carregar imagem manual caso tenha outro nome no PC */
$('#fi').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => $('#bg').setAttribute('href', r.result);
  r.readAsDataURL(f);
};

go();
</script>
</body>
